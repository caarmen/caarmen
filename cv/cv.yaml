    team: 3 back, 2 front
    summary: >
      SaaS platform providing virtual Android devices in the cloud, using a microservices architecture.
      Team of 5 developers (3 back, 2 front), QA, and PO.
    description: >
      Management of an emulator fleet generating over 600,000 execution minutes per year.


      Strong subscription growth of 423% since 2022.


      Technical Lead - OAuth2 Authentication (Desktop Client): steering design and implementation, with close cross-team coordination (back-end / desktop).


      Mediation between SaaS and Desktop teams: implementation of an iterative user story breakdown strategy compatible with our SaaS cycles.


      Resolution of critical production incidents: identification of a bug in Sequelize (transactions and retries) and implementation of retry strategies to stabilize the DB.


      Optimization of SQL performance via the ORM (N+1 problem), a topic presented at PyCon France 2024.


      Optimization of CI/CD pipelines: redesign under Jenkins Multibranch to eliminate build waiting times (up to 1 hour per PR) and bypass GitHub rate limits.


      Design, estimation, and development of Python back-end features (Django REST Framework/FastAPI): REST API endpoints (OpenAPI), data migration and import jobs.


      Microservices architecture: Python and Node.js (Express) services, messaging via RabbitMQ (AMQP).


      Introduction of Clean Architecture concepts for codebase scalability.


      Integration with third-party systems: Stripe, OVHcloud, OIDC/OAuth2 identity providers.


      Support and supervision within the SaaS team (code review, mentoring, lead/referent).


      Created a context-preparation workflow for AI-assisted code reviews, optimizing token overhead and improving review quality.


      Scrum organization, 3-week sprints.
